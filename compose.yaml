services:
  api:
    build:
      context: .
      args:
        TARGETOS: linux
    image: projecthub-api:local
    restart: unless-stopped
    environment:
      PROJECTHUB_LISTEN: 0.0.0.0:8080
      PROJECTHUB_DB_PATH: /var/lib/projecthub/projecthub.db
      PROJECTHUB_AGENT_SOCKET: /run/projecthub-agent/agent.sock
      PROJECTHUB_PROBE_ALLOW_CIDRS: ${PROBE_ALLOW_CIDRS:-}
    volumes:
      - projecthub-data:/var/lib/projecthub
      - ./backups:/backups
    networks:
      - private
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to this server's DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private
      - edge
    depends_on:
      api:
        condition: service_healthy

networks:
  private:
    internal: true
  edge: {}

volumes:
  projecthub-data:
  caddy-data:
  caddy-config:
